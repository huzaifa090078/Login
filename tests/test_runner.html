<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LOGIN Order Form - Automated Test Runner</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <h1>Test Results</h1>
  <div id="test-output">Running tests...</div>

  <script type="module">
    import { CATEGORIES, PRODUCTS, getCategories, getProductsByCategory, getProductById, searchProducts } from '../js/catalog-data.js';
    import { 
      getState, 
      setSelectedCategory,
      subscribe,
      setQuantity, 
      getQuantity, 
      incrementQuantity, 
      decrementQuantity, 
      getTotalItems, 
      getGrandTotal, 
      getOrderSummaryGrouped,
      setSearchQuery,
      WHATSAPP_PHONE,
      formatDateForWhatsApp,
      normalizePakistaniPhoneNumber,
      isValidPakistaniPhoneNumber,
      validateOrder,
      generateWhatsAppMessage,
      getWhatsAppUrl
    } from '../js/state.js';
    import { renderCategoryNav } from '../js/components/categoryNav.js';
    import { renderProductList } from '../js/components/productList.js';
    import { renderSearchBar } from '../js/components/searchBar.js';
    import * as catalogRepo from '../js/catalogRepository.js';
    import { getCategoryIcon } from '../js/icons.js';
    import { saveOrder, getSavedOrders } from '../js/storage.js';

    const results = [];
    function assert(name, condition, details = '') {
      if (condition) {
        results.push({ name, status: 'PASS', details });
        console.log(`[PASS] ${name}`);
      } else {
        results.push({ name, status: 'FAIL', details });
        console.error(`[FAIL] ${name}: ${details}`);
      }
    }

    try {
      // 1. Catalog count & categories
      assert('Total catalog products is exactly 113', PRODUCTS.length === 113, `Count is ${PRODUCTS.length}`);
      
      const cats = getCategories();
      assert('Categories count is 9', cats.length === 9, `Count is ${cats.length}`);
      
      const expectedCatOrder = [
        'chargers', 'data-cables', 'handsfree', 'power-banks', 
        'smart-watches', 'tws', 'neckband-headphones', 'speakers', 'batteries'
      ];
      const actualCatOrder = cats.map(c => c.id);
      assert('Categories follow exact requested order', 
        JSON.stringify(actualCatOrder) === JSON.stringify(expectedCatOrder),
        `Order is: ${actualCatOrder.join(', ')}`
      );

      // 2. Category counts
      assert('Chargers count is 26', getProductsByCategory('chargers').length === 26);
      assert('Data Cables count is 24', getProductsByCategory('data-cables').length === 24);
      assert('Handsfree count is 10', getProductsByCategory('handsfree').length === 10);
      assert('Power Banks count is 8', getProductsByCategory('power-banks').length === 8);
      assert('Smart Watches count is 6', getProductsByCategory('smart-watches').length === 6);
      assert('TWS count is 12', getProductsByCategory('tws').length === 12);
      assert('Neckband & Headphones count is 8', getProductsByCategory('neckband-headphones').length === 8);
      assert('Speakers count is 15', getProductsByCategory('speakers').length === 15);
      assert('Batteries count is 4', getProductsByCategory('batteries').length === 4);

      // 2b. Category Initial Closed State & Single-Active Toggle Behavior
      assert('Initial selectedCategory is null (all categories closed)', getState().selectedCategory === null);
      setSelectedCategory('chargers');
      assert('Selecting Chargers sets selectedCategory to chargers', getState().selectedCategory === 'chargers');
      setSelectedCategory('data-cables');
      assert('Selecting Data Cables switches selectedCategory to data-cables (only 1 open)', getState().selectedCategory === 'data-cables');
      setSelectedCategory('data-cables');
      assert('Tapping active category toggles it closed (selectedCategory === null)', getState().selectedCategory === null);

      // 3. Unique product IDs
      const ids = PRODUCTS.map(p => p.id);
      const uniqueIds = new Set(ids);
      assert('All 113 product IDs are unique', uniqueIds.size === 113, `Unique count: ${uniqueIds.size}`);

      // 4. Duplicate model numbers preserved as distinct products
      const l400Micro = getProductById('charger-l400-micro');
      const l400Typec = getProductById('charger-l400-typec');
      assert('L-400 Micro exists with rate 389', l400Micro && l400Micro.rate === 389 && l400Micro.variant === 'Micro');
      assert('L-400 Type-C exists with rate 399', l400Typec && l400Typec.rate === 399 && l400Typec.variant === 'Type-C');
      assert('Duplicate model numbers are distinct items', l400Micro.id !== l400Typec.id && l400Micro.modelNumber === l400Typec.modelNumber);

      // 5. Coming Soon products cannot be ordered
      const csSpeaker = getProductById('speaker-l267');
      assert('L-267 is marked coming soon with null rate', csSpeaker && csSpeaker.isComingSoon && csSpeaker.rate === null);
      setQuantity('speaker-l267', 5);
      assert('Coming Soon product quantity cannot be set', getQuantity('speaker-l267') === 0);
      incrementQuantity('speaker-l267');
      assert('Coming Soon product increment is prevented', getQuantity('speaker-l267') === 0);

      // 6. Global Search across all fields
      const searchByModel = searchProducts('L-400');
      assert('Search by model "L-400" finds both variants', searchByModel.length === 2);
      
      const searchByName = searchProducts('ELVO');
      assert('Search by name "ELVO" finds matching items', searchByName.length >= 2);

      const searchByVariant = searchProducts('Type-C');
      assert('Search by variant "Type-C" finds matching items across all categories', searchByVariant.length > 5);

      const searchByDescription = searchProducts('POWERBANK');
      assert('Search by "POWERBANK" finds power bank products directly without selecting category', searchByDescription.length === 8);

      // 7. Quantity + and -, line totals, grand totals, and total units
      setQuantity('charger-l400-micro', 5); // 5 * 389 = 1945
      setQuantity('charger-l401-typec', 2); // 2 * 479 = 958
      setQuantity('cable-l901-typec', 3);   // 3 * 209 = 627

      assert('Quantity of L-400 Micro is 5', getQuantity('charger-l400-micro') === 5);
      incrementQuantity('charger-l400-micro'); // becomes 6
      assert('Increment works (quantity is 6)', getQuantity('charger-l400-micro') === 6);
      decrementQuantity('charger-l400-micro'); // becomes 5
      assert('Decrement works (quantity is 5)', getQuantity('charger-l400-micro') === 5);

      // Total Items = 5 + 2 + 3 = 10 units (NOT number of unique products)
      assert('Total Items calculates total units (10)', getTotalItems() === 10, `Got: ${getTotalItems()}`);

      // Grand Total = 1945 + 958 + 627 = 3530
      assert('Grand Total calculates exact PKR sum (3530)', getGrandTotal() === 3530, `Got: ${getGrandTotal()}`);

      // 8. Order summary grouping and empty category filtering
      const summary = getOrderSummaryGrouped();
      assert('Only categories with selected items appear (Chargers and Data Cables)', summary.length === 2);
      assert('First group is Chargers', summary[0].category.id === 'chargers');
      assert('Chargers category total units is 7', summary[0].totalUnits === 7);
      assert('Chargers category total amount is 2903', summary[0].totalAmount === 2903);
      assert('Second group is Data Cables', summary[1].category.id === 'data-cables');
      assert('Data Cables category total units is 3', summary[1].totalUnits === 3);
      assert('Data Cables category total amount is 627', summary[1].totalAmount === 627);

      // 9. WhatsApp Recipient Configuration
      assert('WhatsApp recipient phone is dynamic (no hardcoded recipient)', WHATSAPP_PHONE === '', `Got: ${WHATSAPP_PHONE}`);

      // 10. Date formatting for WhatsApp
      assert('formatDateForWhatsApp formats 2026-09-05 to 05-Sep-2026', formatDateForWhatsApp('2026-09-05') === '05-Sep-2026');

      // 10b. Pakistani Phone Normalization & Validation
      assert('normalizePakistaniPhoneNumber standard 11 digits', normalizePakistaniPhoneNumber('03001234567') === '03001234567');
      assert('normalizePakistaniPhoneNumber removes dashes', normalizePakistaniPhoneNumber('0300-1234567') === '03001234567');
      assert('normalizePakistaniPhoneNumber removes spaces', normalizePakistaniPhoneNumber('0300 1234567') === '03001234567');
      assert('normalizePakistaniPhoneNumber converts +92 prefix', normalizePakistaniPhoneNumber('+923001234567') === '03001234567');
      assert('normalizePakistaniPhoneNumber converts 0092 prefix', normalizePakistaniPhoneNumber('00923001234567') === '03001234567');
      assert('normalizePakistaniPhoneNumber converts 92 prefix', normalizePakistaniPhoneNumber('923001234567') === '03001234567');

      assert('isValidPakistaniPhoneNumber accepts standard 03001234567', isValidPakistaniPhoneNumber('03001234567') === true);
      assert('isValidPakistaniPhoneNumber accepts 03123456789', isValidPakistaniPhoneNumber('03123456789') === true);
      assert('isValidPakistaniPhoneNumber accepts 03211234567', isValidPakistaniPhoneNumber('03211234567') === true);
      assert('isValidPakistaniPhoneNumber accepts 03331234567', isValidPakistaniPhoneNumber('03331234567') === true);
      assert('isValidPakistaniPhoneNumber accepts 03451234567', isValidPakistaniPhoneNumber('03451234567') === true);
      assert('isValidPakistaniPhoneNumber accepts formatted 0300-1234567', isValidPakistaniPhoneNumber('0300-1234567') === true);
      assert('isValidPakistaniPhoneNumber accepts international +92 300 1234567', isValidPakistaniPhoneNumber('+92 300 1234567') === true);
      assert('isValidPakistaniPhoneNumber rejects landline 04231234567', isValidPakistaniPhoneNumber('04231234567') === false);
      assert('isValidPakistaniPhoneNumber rejects short number 12345', isValidPakistaniPhoneNumber('12345') === false);
      assert('isValidPakistaniPhoneNumber rejects 10 digits 0300123456', isValidPakistaniPhoneNumber('0300123456') === false);
      assert('isValidPakistaniPhoneNumber rejects 12 digits 030012345678', isValidPakistaniPhoneNumber('030012345678') === false);
      assert('isValidPakistaniPhoneNumber rejects empty string', isValidPakistaniPhoneNumber('') === false);

      // 11. Send Order Validation
      const testState = {
        customerInfo: { shopName: '', customerName: '', phone: '', address: '', date: '2026-09-05' },
        selectedCategory: 'chargers',
        searchQuery: '',
        cart: {}
      };
      
      const v1 = validateOrder(testState);
      assert('Validation fails when all fields empty & cart empty', !v1.isValid && v1.errors.length === 5);
      assert('Validation requires phone number', v1.errors.includes('Phone Number is required'));

      testState.customerInfo.shopName = 'ABC Mobiles';
      testState.customerInfo.phone = 'invalid-phone';
      const v2 = validateOrder(testState);
      assert('Validation fails when phone format is invalid', !v2.isValid && v2.errors.includes('Enter a valid Pakistani mobile number (e.g. 03001234567)'));

      testState.customerInfo.customerName = 'Ali';
      testState.customerInfo.phone = '0300-1234567';
      testState.customerInfo.address = 'D-Ground, Faisalabad';
      testState.cart = {
        'charger-l400-micro': 5,
        'charger-l401-typec': 2,
        'cable-l901-typec': 3
      };
      
      // With customer details and 10 items in cart, validation should now pass
      const v3 = validateOrder(testState);
      assert('Validation passes when shopName, customerName, phone, address and items exist', v3.isValid, `Errors: ${v3.errors.join(', ')}`);

      // 12. WhatsApp Message Generation
      const waMsg = generateWhatsAppMessage(testState);
      assert('WhatsApp message contains header divider and title', waMsg.includes('━━━━━━━━━━━━━━━━━━━━\n*LOGIN | WHOLESALE ORDER*\n━━━━━━━━━━━━━━━━━━━━'));
      assert('WhatsApp message contains Shop Name', waMsg.includes('Shop Name: ABC Mobiles'));
      assert('WhatsApp message contains Customer Name', waMsg.includes('Customer Name: Ali'));
      assert('WhatsApp message contains Phone Number', waMsg.includes('Customer No.: 03001234567'));
      assert('WhatsApp message contains Address', waMsg.includes('Address: D-Ground, Faisalabad'));
      assert('WhatsApp message contains Date 05 Sep 2026', waMsg.includes('05 Sep 2026'));
      assert('WhatsApp message contains bold category header for Chargers', waMsg.includes('*🔌 CHARGERS*'));
      assert('WhatsApp message contains bold category header for Data Cables', waMsg.includes('*🔌 DATA CABLES*'));
      assert('WhatsApp message contains Model / Description format', waMsg.includes('L-400 ELVO Charger | Micro | 5×389=1945'));
      assert('WhatsApp message contains Total format', waMsg.includes('*TOTAL* 10 Items | *Rs. 3,530*'));
      assert('WhatsApp message contains thank you footer', waMsg.includes('Thank you for your order.'));

      // 13. WhatsApp Deep Link URL
      const waUrlDefault = getWhatsAppUrl(testState);
      assert('WhatsApp URL without recipient starts with https://api.whatsapp.com/send?text=', waUrlDefault.startsWith('https://api.whatsapp.com/send?text='));
      const waUrlWithPhone = getWhatsAppUrl(testState, '03001234567');
      assert('WhatsApp URL with recipient phone starts with https://wa.me/03001234567?text=', waUrlWithPhone.startsWith('https://wa.me/03001234567?text='));
      assert('WhatsApp URL text parameter is URL encoded', waUrlDefault.includes('%E2%94%81%E2%94%81') || waUrlDefault.includes('TOTAL'));

      // 14. Offline Local Order Storage
      import('../js/storage.js').then(async (storage) => {
        storage.clearAllOrders();
        assert('Storage starts empty', storage.getSavedOrders().length === 0);

        const testOrder = {
          date: '2026-09-05',
          shopName: 'Al-Rehman Mobiles',
          customerName: 'Usman',
          phone: '03001234567',
          address: 'Karkhano Market, Peshawar',
          items: [
            { productId: 'charger-l400-micro', modelNumber: 'L-400', productName: 'ELVO Charger', variant: 'Micro', rate: 389, quantity: 2, lineTotal: 778 },
            { productId: 'cable-l901-typec', modelNumber: 'L-901', productName: 'ORIV TPE Wire', variant: 'Type-C', rate: 209, quantity: 3, lineTotal: 627 }
          ],
          totalItems: 5,
          grandTotal: 1405,
          status: 'Pending'
        };

        const saved = storage.saveOrder(testOrder);
        assert('saveOrder returns saved order with unique orderId', saved && saved.orderId && saved.orderId.startsWith('ORD-'));
        assert('Saved order status defaults to Pending', saved.status === 'Pending');
        assert('Saved order retains totalItems (5)', saved.totalItems === 5);
        assert('Saved order retains grandTotal (1405)', saved.grandTotal === 1405);
        assert('Saved order retains line items', saved.items.length === 2);
        assert('Saved order retains phone number', saved.phone === '03001234567');

        // 15. Persistence & Retrieval across sessions
        const allOrders = storage.getSavedOrders();
        assert('getSavedOrders retrieves saved order from storage', allOrders.length === 1 && allOrders[0].orderId === saved.orderId);
        assert('getPendingOrdersCount is 1', storage.getPendingOrdersCount() === 1);

        // 16. Update order status to Sent
        const updated = storage.updateOrderStatus(saved.orderId, 'Sent');
        assert('updateOrderStatus updates status to Sent', updated && updated.status === 'Sent');
        assert('Pending count decrements to 0 after status update', storage.getPendingOrdersCount() === 0);

        // 17. Saved order WhatsApp message formatting
        const savedOrdersModule = await import('../js/components/savedOrders.js');
        const savedWaMsg = savedOrdersModule.generateSavedOrderWhatsAppMessage(saved);
        assert('generateSavedOrderWhatsAppMessage contains bold category header for Chargers', savedWaMsg.includes('*🔌 CHARGERS*'));
        assert('generateSavedOrderWhatsAppMessage contains Shop Name', savedWaMsg.includes('Shop Name: Al-Rehman Mobiles'));
        assert('generateSavedOrderWhatsAppMessage contains Model L-400', savedWaMsg.includes('L-400 ELVO Charger | Micro | 2×389=778'));
        assert('generateSavedOrderWhatsAppMessage contains Total line', savedWaMsg.includes('*TOTAL* 5 Items | *Rs. 1,405*'));

        // 18. Delete order
        storage.deleteOrder(saved.orderId);
        assert('deleteOrder removes order from storage', storage.getSavedOrders().length === 0);

        // 19. Interactive DOM Component Testing
        const testContainer = document.createElement('div');
        testContainer.id = 'dom-test-container';
        testContainer.innerHTML = `
          <div id="test-search-mount"></div>
          <div id="test-category-mount"></div>
          <main id="test-product-list-mount"></main>
        `;
        document.body.appendChild(testContainer);

        const testSearchMount = testContainer.querySelector('#test-search-mount');
        const testCategoryMount = testContainer.querySelector('#test-category-mount');
        const testProductMount = testContainer.querySelector('#test-product-list-mount');

        subscribe((eventType) => {
          if (eventType === 'category_changed' || eventType === 'search_changed') {
            renderCategoryNav(testCategoryMount);
            renderProductList(testProductMount);
          }
        });

        // Initially ensure selectedCategory is null
        setSelectedCategory(null);
        renderSearchBar(testSearchMount);
        renderCategoryNav(testCategoryMount);
        renderProductList(testProductMount);

        // Assert 0 products initially rendered
        assert('DOM Initial State: 0 products rendered in product list', testProductMount.querySelectorAll('.product-card').length === 0);
        assert('DOM Initial State: 9 category pills rendered', testCategoryMount.querySelectorAll('.category-pill').length === 9);
        assert('DOM Initial State: 0 active category pills', testCategoryMount.querySelectorAll('.category-pill.active').length === 0);

        // Assert 3-column layout structure
        const gridEl = testCategoryMount.querySelector('.category-pills-grid');
        assert('Category pills grid exists', !!gridEl);

        const compGrid = window.getComputedStyle(gridEl);
        const colTracks = compGrid.gridTemplateColumns.split(' ').filter(Boolean);
        assert('Category pills grid has exactly 3 columns', colTracks.length === 3, `Found ${colTracks.length} columns: ${compGrid.gridTemplateColumns}`);

        // Verify all 9 categories order in 3 rows of 3:
        // Row 1: Chargers, Data Cables, Handsfree
        // Row 2: Power Banks, Smart Watches, TWS
        // Row 3: Neckband & Headphones, Speakers, Batteries
        const pillsArr = Array.from(testCategoryMount.querySelectorAll('.category-pill'));
        const pillIds = pillsArr.map(p => p.getAttribute('data-category-id'));
        const expectedPillIds = [
          'chargers', 'data-cables', 'handsfree',
          'power-banks', 'smart-watches', 'tws',
          'neckband-headphones', 'speakers', 'batteries'
        ];
        assert('Category pills follow exact 3x3 ordering across 3 rows', JSON.stringify(pillIds) === JSON.stringify(expectedPillIds));

        // Click Chargers pill
        const chargersPill = testCategoryMount.querySelector('[data-category-id="chargers"]');
        assert('Chargers pill exists', !!chargersPill);
        chargersPill.click();

        assert('After clicking Chargers: 26 products rendered', testProductMount.querySelectorAll('.product-card').length === 26);
        const activeChargersPill = testCategoryMount.querySelector('[data-category-id="chargers"]');
        assert('After clicking Chargers: Chargers pill is active', activeChargersPill.classList.contains('active'));

        // Click Data Cables pill (Switches category)
        const cablesPill = testCategoryMount.querySelector('[data-category-id="data-cables"]');
        cablesPill.click();

        assert('After clicking Data Cables: 24 products rendered', testProductMount.querySelectorAll('.product-card').length === 24);
        assert('After clicking Data Cables: Chargers pill is NOT active', !testCategoryMount.querySelector('[data-category-id="chargers"]').classList.contains('active'));
        const activeCablesPill = testCategoryMount.querySelector('[data-category-id="data-cables"]');
        assert('After clicking Data Cables: Data Cables pill is active', activeCablesPill.classList.contains('active'));

        // Click Data Cables again to toggle closed
        activeCablesPill.click();
        assert('After clicking active pill again: 0 products rendered (closed state)', testProductMount.querySelectorAll('.product-card').length === 0);
        assert('After clicking active pill again: 0 active pills', testCategoryMount.querySelectorAll('.category-pill.active').length === 0);

        // Search test without category
        setSearchQuery('L-400');
        assert('Search for L-400 displays 2 matching products globally', testProductMount.querySelectorAll('.product-card').length === 2);

        // Clear search
        setSearchQuery('');
        assert('Clearing search restores 0 products rendered', testProductMount.querySelectorAll('.product-card').length === 0);

        // 20. Mobile Viewport Layout Verification (375px simulated mobile viewport)
        testContainer.style.width = '375px';
        testContainer.style.boxSizing = 'border-box';
        testContainer.style.padding = '0';

        renderCategoryNav(testCategoryMount);

        const renderedPills = Array.from(testCategoryMount.querySelectorAll('.category-pill'));
        const rowBuckets = {};
        renderedPills.forEach((p) => {
          const rect = p.getBoundingClientRect();
          const topRounded = Math.round(rect.top);
          if (!rowBuckets[topRounded]) rowBuckets[topRounded] = [];
          rowBuckets[topRounded].push({
            id: p.getAttribute('data-category-id'),
            name: p.querySelector('.pill-name').textContent.trim(),
            width: Math.round(rect.width),
            height: Math.round(rect.height)
          });
        });

        const distinctRows = Object.keys(rowBuckets).sort((a, b) => Number(a) - Number(b));
        assert('Mobile viewport has exactly 3 rows of pills', distinctRows.length === 3, `Found ${distinctRows.length} rows`);

        const pillsPerRow = distinctRows.map(k => rowBuckets[k].length);
        assert('Exactly 3 pills fit per row on mobile: [3, 3, 3]', JSON.stringify(pillsPerRow) === JSON.stringify([3, 3, 3]), `Got: ${JSON.stringify(pillsPerRow)}`);

        // Check Row 1: Chargers, Data Cables, Handsfree
        const row1Names = rowBuckets[distinctRows[0]].map(p => p.name);
        assert('Row 1 contains Chargers, Data Cables, Handsfree', 
          row1Names.includes('Chargers') && row1Names.includes('Data Cables') && row1Names.includes('Handsfree'),
          `Row 1 has: ${row1Names.join(', ')}`
        );

        // Check Row 2: Power Banks, Smart Watches, TWS
        const row2Names = rowBuckets[distinctRows[1]].map(p => p.name);
        assert('Row 2 contains Power Banks, Smart Watches, TWS', 
          row2Names.includes('Power Banks') && row2Names.includes('Smart Watches') && row2Names.includes('TWS'),
          `Row 2 has: ${row2Names.join(', ')}`
        );

        // Check Row 3: Neckband & Headphones, Speakers, Batteries
        const row3Names = rowBuckets[distinctRows[2]].map(p => p.name);
        assert('Row 3 contains Neckband & Headphones, Speakers, Batteries', 
          row3Names.includes('Neckband & Headphones') && row3Names.includes('Speakers') && row3Names.includes('Batteries'),
          `Row 3 has: ${row3Names.join(', ')}`
        );

        // Check equal width across all 3 columns (tolerance <= 2px)
        const row1Widths = rowBuckets[distinctRows[0]].map(p => p.width);
        const maxDiff = Math.max(...row1Widths) - Math.min(...row1Widths);
        assert('Equal column widths in 3-column grid (tolerance <= 2px)', maxDiff <= 2, `Widths: ${row1Widths.join(', ')}`);

        // Check "Neckband & Headphones" pill height
        const neckbandPill = renderedPills.find(p => p.getAttribute('data-category-id') === 'neckband-headphones');
        assert('Neckband & Headphones pill exists', !!neckbandPill);
        const neckbandRect = neckbandPill.getBoundingClientRect();
        assert('Neckband & Headphones pill has valid height (>= 34px)', neckbandRect.height >= 34, `Height: ${neckbandRect.height}px`);

        // ==================================================
        // 11. FUTURE-PROOF CATALOG MANAGEMENT TESTS (USER SCENARIOS 1 - 6)
        // ==================================================
        
        // TEST 1 — NEW CATEGORY
        const newCat = catalogRepo.addCategory({
          id: 'bluetooth-adapters',
          name: 'Bluetooth Adapters',
          icon: 'bluetooth',
          sortOrder: 10,
          active: true
        });
        assert('Test 1: New category created with ID bluetooth-adapters', newCat.id === 'bluetooth-adapters');
        const activeCats = catalogRepo.getActiveCategories();
        assert('Test 1: Category appears automatically in active categories (count 10)', activeCats.some(c => c.id === 'bluetooth-adapters'));
        assert('Test 1: Category icon resolves valid outline SVG', getCategoryIcon(newCat.icon).includes('<svg'));
        
        // Test category disable
        catalogRepo.updateCategory('bluetooth-adapters', { active: false });
        assert('Test 1: Disabling category removes it from active ordering list', !catalogRepo.getActiveCategories().some(c => c.id === 'bluetooth-adapters'));
        
        // Re-enable
        catalogRepo.updateCategory('bluetooth-adapters', { active: true });
        assert('Test 1: Re-enabling category restores it to active list', catalogRepo.getActiveCategories().some(c => c.id === 'bluetooth-adapters'));

        // TEST 2 — NEW PRODUCT
        const newProd = catalogRepo.addProduct({
          categoryId: 'bluetooth-adapters',
          modelNumber: 'L-950',
          productName: 'Bluetooth Adapter',
          variant: 'USB',
          description: 'USB Bluetooth Adapter',
          rate: 799,
          available: true,
          sortOrder: 1
        });
        assert('Test 2: New product created with generated ID', !!newProd.id && newProd.id.includes('l-950'));
        const prodsInCat = catalogRepo.getProductsByCategory('bluetooth-adapters');
        assert('Test 2: Product automatically appears inside Bluetooth Adapters', prodsInCat.some(p => p.modelNumber === 'L-950'));

        // Product is searchable
        const searchResults = catalogRepo.searchProducts('L-950');
        assert('Test 2: Product is searchable by model number', searchResults.some(p => p.id === newProd.id));

        // Quantity controls work
        setQuantity(newProd.id, 2);
        assert('Test 2: Quantity set to 2', getQuantity(newProd.id) === 2);
        const lineTotal = newProd.rate * 2;
        assert('Test 2: Line total calculated correctly (799 * 2 = 1598)', lineTotal === 1598);
        assert('Test 2: Grand total includes line total', getGrandTotal() >= 1598);

        // Order summary includes product
        const summaryGrouped = getOrderSummaryGrouped();
        const btGroup = summaryGrouped.find(g => g.category.id === 'bluetooth-adapters');
        assert('Test 2: Product appears correctly in order summary group', !!btGroup && btGroup.items.some(i => i.productId === newProd.id));

        // WhatsApp message includes correct information
        const waMsg = generateWhatsAppMessage();
        assert('Test 2: WhatsApp message includes Model / Description', waMsg.includes('L-950 Bluetooth Adapter | USB | 2×799=1598'));

        // TEST 3 — PRICE CHANGE
        // Save historical order with original price 799
        const historicalPayload = {
          date: '2026-09-05',
          shopName: 'Test Mobile Center',
          customerName: 'Tariq Mehmood',
          address: 'Hall Road, Lahore',
          items: [{
            productId: newProd.id,
            modelNumber: 'L-950',
            productName: 'Bluetooth Adapter',
            variant: 'USB',
            rate: 799,
            quantity: 2,
            lineTotal: 1598
          }],
          totalItems: 2,
          grandTotal: 1598,
          status: 'Sent'
        };
        saveOrder(historicalPayload);

        // Change price of L-950 from 799 to 899
        catalogRepo.updateProduct(newProd.id, { rate: 899 });
        assert('Test 3: Catalog price updated to 899', catalogRepo.getProductById(newProd.id).rate === 899);

        // New order calculation uses 899
        assert('Test 3: Active cart line total uses updated price 899 (899 * 2 = 1798)', getGrandTotal() === 1798);

        // Historical order retains 799
        const savedOrders = getSavedOrders();
        const foundOrder = savedOrders.find(o => o.shopName === 'Test Mobile Center');
        assert('Test 3: Historical order retained original priceAtOrderTime 799', foundOrder && foundOrder.items[0].priceAtOrderTime === 799);
        assert('Test 3: Historical order retained original lineTotal 1598', foundOrder && foundOrder.items[0].lineTotal === 1598);

        // TEST 4 — COMING SOON PRODUCT
        const csProd = catalogRepo.addProduct({
          categoryId: 'bluetooth-adapters',
          modelNumber: 'L-960',
          productName: 'Pro Bluetooth Adapter',
          variant: 'Type-C',
          rate: null,
          available: false,
          sortOrder: 2
        });
        assert('Test 4: Coming soon product added with available: false', !!csProd && csProd.available === false);
        setQuantity(csProd.id, 5);
        assert('Test 4: Quantity remains 0 for coming soon / unavailable product', getQuantity(csProd.id) === 0);

        // TEST 5 — CATEGORY RENAME
        catalogRepo.updateCategory('bluetooth-adapters', { name: 'Wireless Adapters' });
        const renamedCat = catalogRepo.getCategoryById('bluetooth-adapters');
        assert('Test 5: Category display name renamed to Wireless Adapters', renamedCat.name === 'Wireless Adapters');
        assert('Test 5: Stable ID remains bluetooth-adapters', renamedCat.id === 'bluetooth-adapters');
        const wirelessProds = catalogRepo.getProductsByCategory('bluetooth-adapters');
        assert('Test 5: Existing products remain connected via categoryId', wirelessProds.some(p => p.modelNumber === 'L-950'));
        const waRenamedMsg = generateWhatsAppMessage();
        assert('Test 5: WhatsApp message contains product L-950', waRenamedMsg.includes('L-950 Bluetooth Adapter'));

        // TEST 6 — DYNAMIC SEARCH
        const searchL950 = catalogRepo.searchProducts('L-950');
        assert('Test 6: Search L-950 returns new product', searchL950.some(p => p.modelNumber === 'L-950'));
        const searchBt = catalogRepo.searchProducts('Bluetooth');
        assert('Test 6: Search Bluetooth returns new product', searchBt.some(p => p.modelNumber === 'L-950'));
        const searchWireless = catalogRepo.searchProducts('Wireless');
        assert('Test 6: Search Wireless returns new product via category name', searchWireless.some(p => p.modelNumber === 'L-950'));

        // Clean up test items
        setQuantity(newProd.id, 0);
        catalogRepo.resetToDefaultCatalog();

        // Render final test summary
        renderTestSummary();
      });

      // Clean up cart after tests
      setQuantity('charger-l400-micro', 0);
      setQuantity('charger-l401-typec', 0);
      setQuantity('cable-l901-typec', 0);

    } catch (err) {
      assert('Unexpected runtime error', false, err.message + '\n' + err.stack);
      renderTestSummary();
    }

    function renderTestSummary() {
      const failed = results.filter(r => r.status === 'FAIL');
      const outDiv = document.getElementById('test-output');
      outDiv.innerHTML = `
        <h2>${failed.length === 0 ? 'ALL TESTS PASSED' : 'TESTS FAILED'}</h2>
        <p>Total: ${results.length}, Passed: ${results.length - failed.length}, Failed: ${failed.length}</p>
        <pre>${JSON.stringify(results, null, 2)}</pre>
      `;
      window.__TEST_RESULTS__ = { total: results.length, failed: failed.length, results };
    }

  </script>
</body>
